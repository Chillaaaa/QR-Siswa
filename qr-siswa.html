<title>Scan QR | Flash Card Digital</title>
<meta name="description" content="Pindai QR untuk membuka Flash Card Digital Hukum Permintaan dan Hukum Penawaran.">
<meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#06122b;--gold:#f5b942;--teal:#2dd4bf;--head:"Playfair Display",Georgia,"Times New Roman",serif;--body:"Open Sans","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:#fff;line-height:1.55;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px 16px;
  background:linear-gradient(165deg,#01030a 0%,#06143a 38%,#0a2a66 68%,#02050f 100%) fixed;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px)}
.bg .a{width:460px;height:460px;top:-140px;left:-140px;background:#1d4ed8;opacity:.5}
.bg .b{width:520px;height:520px;bottom:-200px;right:-160px;background:#0b3a8a;opacity:.7}
.bg .c{width:340px;height:340px;top:40%;right:-120px;background:#2563eb;opacity:.45}
h1{font-family:var(--head);margin:0;line-height:1.15}
main{position:relative;z-index:1;width:100%;max-width:980px}
.glass{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(18px,3.5vw,38px);border-radius:30px;
  background:rgba(255,255,255,.1);border:1px solid rgba(94,234,212,.7);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 14px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(6,18,44,.94)}}
.qr{display:block;line-height:0;background:#fff;border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.qr img{display:block;width:min(46vw,64vh,460px);height:auto;aspect-ratio:1;border-radius:16px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#5eead4;margin:0 0 10px}
h1{font-size:clamp(1.9rem,4.4vw,3.2rem);font-weight:800}
h1 em{color:#5eead4}
.lead{margin:12px 0 0;font-size:clamp(1rem,1.9vw,1.2rem);color:#dbe7ff}
ol{list-style:none;counter-reset:s;margin:18px 0 0;padding:0;display:grid;gap:10px}
ol li{counter-increment:s;display:flex;gap:12px;align-items:center;font-weight:600;font-size:clamp(.95rem,1.7vw,1.1rem)}
ol li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;display:grid;place-items:center}
.alt{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.22);font-size:.92rem;color:#dbe7ff}
.btn{display:inline-block;margin-top:10px;text-decoration:none;font-weight:800;font-size:.95rem;padding:11px 22px;border-radius:999px;background:var(--teal);color:var(--ink);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.4)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media (max-width:760px){
  .glass{grid-template-columns:1fr;justify-items:center;text-align:center}
  .qr img{width:min(78vw,380px)}
  ol{justify-items:start;text-align:left}
  .alt{width:100%}
}
@media (max-height:520px) and (orientation:landscape){ .qr img{width:min(40vw,72vh)} }
</style>
</head>
